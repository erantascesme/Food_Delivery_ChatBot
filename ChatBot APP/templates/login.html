<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FoodBot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <div class="logo-icon">🍔</div>
            <h1>Food Delivery Bot</h1>
            <p>Your Personal AI Waiter</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="input-group">
                <label for="user_id">Customer ID or Name</label>
                <input type="text" id="user_id" name="user_id" placeholder="e.g., C001 or Erani" required>
            </div>

            <button type="submit" class="login-btn">Start Ordering</button>
        </form>

        <div class="login-footer">
            New here? <a href="{{ url_for('signup') }}" style="color: #FF5722; font-weight: bold; text-decoration: none;">Create an account</a>
        </div>
    </div>

</body>
</html>
